services:
  # ── Read-only Docker API boundary ────────────────────────────────────
  # The backend never receives the Docker socket. This proxy only exposes
  # read endpoints used for container inventory, stats, health, and logs.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: jarvis-docker-proxy
    environment:
      - CONTAINERS=1
      - INFO=1
      - NETWORKS=1
      - SERVICES=0
      - TASKS=0
      - IMAGES=0
      - VOLUMES=0
      - POST=0
      - AUTH=0
      - SECRETS=0
      - SWARM=0
      - SYSTEM=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    restart: unless-stopped

  # ── Vector Database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jarvis-qdrant
    ports:
     - "6335:6333"
     - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-lc", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jarvis-backend
    ports:
      - "8001:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_FALLBACK_MODELS=${GROQ_FALLBACK_MODELS:-openai/gpt-oss-20b,llama-3.1-8b-instant}
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      - GROQ_VISION_FALLBACK_MODELS=${GROQ_VISION_FALLBACK_MODELS:-qwen/qwen3.6-27b}
      - GROQ_RESEARCH_MODEL=${GROQ_RESEARCH_MODEL:-groq/compound}
      - GROQ_REPORT_MODEL=${GROQ_REPORT_MODEL:-openai/gpt-oss-120b}
      - LLM_PRIMARY=${LLM_PRIMARY:-groq}
      - DEMO_BUILD_TIMEOUT=${DEMO_BUILD_TIMEOUT:-600}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1024}
      - LLM_HISTORY_TURNS=${LLM_HISTORY_TURNS:-6}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_USERNAME=${GITHUB_USERNAME:-Siddarthb07}
      - DOCKER_MONITOR_ENABLED=${DOCKER_MONITOR_ENABLED:-1}
      - DOCKER_HOST=tcp://docker-proxy:2375
      - INFRA_DOCKER_SNAPSHOT_PATH=/app/data/infra/docker_snapshot.json
      - INFRA_SITE_POLL_SEC=${INFRA_SITE_POLL_SEC:-60}
      - INFRA_DOCKER_POLL_SEC=${INFRA_DOCKER_POLL_SEC:-10}
      - INFRA_PAGES_DISCOVERY_SEC=${INFRA_PAGES_DISCOVERY_SEC:-1800}
      - INFRA_RETENTION_DAYS=${INFRA_RETENTION_DAYS:-30}
      # Always /vault inside the container; host folder is bind-mounted below
      - VAULT_PATH=/vault
      - JARVIS_MASTER_KEY=${JARVIS_MASTER_KEY:-}
      - PUBLIC_MODE=${PUBLIC_MODE:-0}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - TTS_ENGINE=${TTS_ENGINE:-pyttsx3}
      - TTS_VOICE=${TTS_VOICE:-american_female}
      - TTS_ESPEAK_VOICE=${TTS_ESPEAK_VOICE:-en-us+f3}
      - IMAGE_ENABLED=${IMAGE_ENABLED:-true}
      - IMAGE_MODEL_ID=${IMAGE_MODEL_ID:-segmind/tiny-sd}
      - IMAGE_DEVICE=${IMAGE_DEVICE:-auto}
      - IMAGE_DEFAULT_STEPS=${IMAGE_DEFAULT_STEPS:-12}
      - IMAGE_MAX_STEPS=${IMAGE_MAX_STEPS:-20}
      - IMAGE_DEFAULT_SIZE=${IMAGE_DEFAULT_SIZE:-512}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8001/calendar/google/callback}
      - GOOGLE_FRONTEND_URL=${GOOGLE_FRONTEND_URL:-http://127.0.0.1:5055}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - GOOGLE_CALENDAR_SYNC_TTL=${GOOGLE_CALENDAR_SYNC_TTL:-300}
      - GOOGLE_CALENDAR_MAX_EVENTS=${GOOGLE_CALENDAR_MAX_EVENTS:-8}
      - DEMO_HOST_ROOT=C:/Users/siddu/OneDrive/Desktop/AI-BRAIN/backend/data/generated/demos
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      # Host-visible demos for Monaco edit + Open in Cursor
      - ./backend/data/generated:/app/data/generated
      - ./backend/data/infra:/app/data/infra
      - whisper_cache:/root/.cache/whisper
      - huggingface_cache:/root/.cache/huggingface
      - C:/Users/siddu/OneDrive/Desktop/jarvis-vault:/vault
    depends_on:
      qdrant:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    # Ensure docker SDK is present even when the image predates requirements.txt updates
    # (avoids empty container shell on BrainGraph after --no-build recreates).
    command:
      [
        "sh",
        "-c",
        "pip install -q docker==7.1.0 && uvicorn main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jarvis-frontend
    ports:
      # Use 5055 — Windows often maps localhost:5050 to a broken IPv6/WSL relay
      # that returns ERR_CONNECTION_REFUSED. Prefer http://127.0.0.1:5055
      - "5055:3000"
    environment:
      # Prefer same-origin /backend proxy — Docker Desktop's localhost:8001 publish
      # is flaky on Windows (IPv6 + long Ollama probe timeouts looked like "backend down").
      - NEXT_PUBLIC_API_URL=/backend
      # Same-origin /backend proxy inside the Next container → FastAPI service
      - JARVIS_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  backend_data:
  whisper_cache:
  huggingface_cache:
